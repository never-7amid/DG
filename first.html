			<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحلّل</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #344b66 0%, #59627f 48%, #817b9b 100%);
      color: #fff;
    }
    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    .stars {
      position: absolute;
      inset: 0 auto auto 0;
      width: 48%;
      height: 34%;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      filter: drop-shadow(1px 3px 1px rgba(98, 54, 12, .45));
      animation: drift var(--duration) ease-in-out infinite alternate;
      transform-origin: center;
    }
    .star svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .star-one { left: 10%; top: 13%; --size: 17vw; --duration: 4.8s; }
    .star-two { left: 57%; top: 13%; --size: 16vw; --duration: 5.5s; animation-delay: -.8s; }
    .star-three { left: 24%; top: 34%; --size: 27vw; --duration: 6.2s; animation-delay: -1.7s; }
    @keyframes drift {
      from { translate: -5px 0; }
      to { translate: 7px 0; }
    }
    .title {
      position: absolute;
      top: 35.5%;
      left: 0;
      width: 100%;
      margin: 0;
      color: #c6a300;
      font-size: clamp(3.5rem, 12vw, 7rem);
      line-height: 1.25;
      font-weight: 400;
      text-align: center;
      letter-spacing: .02em;
    }
    .tagline {
      position: absolute;
      top: 57.4%;
      left: 4%;
      width: 92%;
      margin: 0;
      text-align: center;
      white-space: nowrap;
      color: #fff;
      font-size: clamp(.85rem, 3.25vw, 1.75rem);
      font-weight: 400;
    }
    .join {
      position: absolute;
      top: 71.3%;
      left: 24%;
      width: 48%;
      height: 17.2%;
      min-height: 95px;
      max-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(115deg, rgba(53, 72, 98, .97), rgba(139, 130, 164, .98));
      color: #05040a;
      box-shadow: 9px 10px 0 #201c2d, 18px 18px 0 rgba(31, 27, 43, .28);
      text-decoration: none;
      font-size: clamp(1.25rem, 4.2vw, 2.1rem);
      font-weight: 800;
      transition: transform .15s ease;
    }
    .join:active { transform: translate(2px, 3px); }
    @media (min-width: 700px) {
      .star-one { --size: 120px; }
      .star-two { --size: 125px; }
      .star-three { --size: 210px; }
      .stars { width: 48%; }
      .tagline { font-size: clamp(1.25rem, 2.2vw, 1.75rem); }
      .join { left: 24%; width: 48%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="stars" aria-hidden="true">
      <div class="star star-one">
        <svg viewBox="0 0 100 100">
          <polygon points="50,5 62,35 95,38 70,59 78,91 50,74 22,91 30,59 5,38 38,35"
            fill="#f2b94f" stroke="#d78d22" stroke-width="2.2" stroke-linejoin="round"/>
          <polyline points="50,5 62,35 95,38" fill="none" stroke="#ffd37a" stroke-width="2"/>
        </svg>
      </div>
      <div class="star star-two">
        <svg viewBox="0 0 100 100">
          <polygon points="50,5 62,35 95,38 70,59 78,91 50,74 22,91 30,59 5,38 38,35"
            fill="#d88b20" stroke="#b87417" stroke-width="2.2" stroke-linejoin="round"/>
          <polygon points="50,5 62,35 95,38 70,59 78,91 50,74 22,91 30,59 5,38 38,35"
            fill="none" stroke="#f7c466" stroke-width="1.5" transform="translate(-4,-3)"/>
        </svg>
      </div>
      <div class="star star-three">
        <svg viewBox="0 0 100 100">
          <polygon points="50,4 62,35 96,38 70,60 78,94 50,76 21,94 29,60 4,38 38,35"
            fill="#e9a52e" stroke="#c98220" stroke-width="2.4" stroke-linejoin="round"/>
          <polyline points="50,4 62,35 96,38" fill="none" stroke="#ffd06a" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <h1 class="title">المُحلِّل</h1>
    <p class="tagline">هل تريد أن تحصل على لقب المحلل؟؟! 🔎🔎</p>
    <a class="join" href="login.html">شارك الان</a>
  </main>
</body>
</html>
